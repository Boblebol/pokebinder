name: Feature request
description: Suggest a focused improvement for PokéClasseur.
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest useful version of the feature.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways this could be solved, including doing nothing.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, screenshots, related data, or implementation notes.
